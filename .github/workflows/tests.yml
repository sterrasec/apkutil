name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/ci/requirements.txt
      - name: Cache verified tool downloads
        if: runner.os != 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/ci
          key: ci-tools-${{ runner.os }}-${{ hashFiles('.github/ci/setup_tools.py') }}
      - name: Install pinact
        if: runner.os == 'Linux'
        run: python .github/ci/setup_tools.py pinact
      - name: Verify action pins
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pinact run --check --verify
      - name: Install hash-locked Python dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/ci/requirements.txt
      - name: Install project without resolving more dependencies
        run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pip check
      - name: Run regression tests
        run: python -m pytest -q
      # macOS runs the portable tests; Linux and Windows cover the real SDK.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: runner.os != 'macOS'
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse runner SDK and install only missing packages
        if: runner.os != 'macOS'
        shell: python
        run: |
          import os
          from pathlib import Path
          import sys
          from apkutil.util import _run_subprocess
          sdk = Path(os.environ['ANDROID_HOME'])
          packages = {
              'platform-tools': sdk / 'platform-tools',
              'build-tools;35.0.0': sdk / 'build-tools/35.0.0',
              'platforms;android-35': sdk / 'platforms/android-35',
          }
          missing = [name for name, path in packages.items() if not path.is_dir()]
          if missing:
              suffix = '.bat' if os.name == 'nt' else ''
              manager = sdk / ('cmdline-tools/latest/bin/sdkmanager' + suffix)
              out, err, code = _run_subprocess([str(manager)] + missing)
              print(out)
              print(err, file=sys.stderr)
              sys.exit(code)
      - name: Install verified apktool with a path containing spaces
        if: runner.os != 'macOS'
        run: python .github/ci/setup_tools.py apktool
      - name: Exercise info, debuggable, and build with real tools
        if: runner.os != 'macOS'
        env:
          APKUTIL_SDK_TESTS: '1'
        run: python -m pytest -q tests/test_sdk_integration.py
